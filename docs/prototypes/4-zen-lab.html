<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 4: Zen Lab 极简实验室 — 物理模板原型</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100vh;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;}

.app{display:flex;flex-direction:column;height:100vh;}

/* === ULTRA MINIMAL TOP === */
.topbar{height:42px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;}
.t-name{font-size:14px;font-weight:700;color:#333;}
.t-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;margin-left:6px;}
.t-scene{font-size:12px;color:#999;margin-left:4px;}
.spacer{flex:1;}
.t-tabs{display:flex;gap:1px;background:#f0f0f0;border-radius:6px;padding:2px;}
.t-tab{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;color:#999;transition:all .15s;font-family:inherit;}
.t-tab.active{background:#fff;color:#333;box-shadow:0 1px 2px rgba(0,0,0,.06);}

/* === FULL WIDTH CANVAS === */
.canvas-area{flex:1;position:relative;overflow:hidden;}
.c-bg{position:absolute;inset:0;transition:background .5s;}
.c-bg.bg-m{background:#f5f5f5;}
.c-bg.bg-c{background:#0d1117;}
.c-bg.bg-e{background:#f8f7f4;}
.c-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.scene-svg{display:none;}.scene-svg.active{display:block;}

/* Floating mini play button on canvas */
.float-play{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;width:48px;height:48px;border-radius:50%;background:#333;color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.float-play:hover{transform:translateX(-50%) scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,.2);}
.float-play:active{transform:translateX(-50%) scale(.95);}
.c-bg.bg-c ~ .float-play{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.3);}

/* === BOTTOM DOCK === */
.dock{flex-shrink:0;background:#fff;border-top:1px solid #eee;transition:max-height .4s cubic-bezier(.4,0,.2,1);}
.dock-row{display:flex;align-items:center;padding:10px 20px;gap:10px;overflow-x:auto;}
.dock-row::-webkit-scrollbar{display:none;}

/* Parameter pills */
.pill{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#f5f5f5;border-radius:20px;flex-shrink:0;transition:all .15s;cursor:default;}
.pill:hover{background:#eee;transform:translateY(-1px);}
.pill-label{font-size:11px;color:#999;font-weight:500;white-space:nowrap;}
.pill-val{font-size:14px;font-weight:700;color:#333;white-space:nowrap;}
.pill-slider{width:80px;height:4px;-webkit-appearance:none;appearance:none;background:#ddd;border-radius:2px;outline:none;cursor:pointer;}
.pill-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#333;border-radius:50%;cursor:pointer;}
.c-bg.bg-c ~ .dock .pill{background:#1e2333;}.c-bg.bg-c ~ .dock .pill-label{color:#666;}.c-bg.bg-c ~ .dock .pill-val{color:#e0e0e0;}
.c-bg.bg-c ~ .dock{background:#141820;border-color:#222;}
.c-bg.bg-c ~ .dock .pill-slider{background:#333;}.c-bg.bg-c ~ .dock .pill-slider::-webkit-slider-thumb{background:#888;}

/* Readout pills */
.readout-pill{padding:6px 14px;background:#f0f0f0;border-radius:16px;flex-shrink:0;font-size:12px;display:flex;align-items:center;gap:5px;}
.rp-dot{width:5px;height:5px;border-radius:50%;}
.rp-val{font-weight:700;}
.rp-unit{color:#999;font-size:10px;}
.c-bg.bg-c ~ .dock .readout-pill{background:#1e2333;color:#ccc;}.c-bg.bg-c ~ .dock .rp-unit{color:#555;}

/* Expand toggle */
.dock-toggle{display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer;font-size:11px;color:#bbb;gap:4px;border-top:1px solid #f0f0f0;transition:color .15s;}
.dock-toggle:hover{color:#666;}
.c-bg.bg-c ~ .dock .dock-toggle{border-color:#222;color:#555;}.c-bg.bg-c ~ .dock .dock-toggle:hover{color:#999;}
.dock-extra{max-height:0;overflow:hidden;transition:max-height .3s;}
.dock-extra.open{max-height:120px;}
.dock-extra-inner{padding:8px 20px 12px;display:flex;gap:8px;flex-wrap:wrap;}

/* Params & readouts for each scene */
.pg{display:none;width:100%;}.pg.active{display:contents;}
</style>
</head>
<body>

<div class="app">
  <!-- MINIMAL TOP -->
  <div class="topbar">
    <span class="t-name" id="tName">斜面受力</span>
    <span class="t-dot"></span>
    <span class="t-scene" id="tScene">力学</span>
    <div class="spacer"></div>
    <div class="t-tabs">
      <button class="t-tab active" onclick="sw('m')">力学</button>
      <button class="t-tab" onclick="sw('c')">天体</button>
      <button class="t-tab" onclick="sw('e')">电路</button>
    </div>
  </div>

  <!-- FULL WIDTH CANVAS -->
  <div class="canvas-area">
    <div class="c-bg bg-m" id="cBg"></div>
    <div class="c-center">
      <!-- Mechanics -->
      <svg class="scene-svg active" id="sv-m" width="600" height="420" viewBox="0 0 600 420">
        <defs>
          <marker id="zR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d44"/></marker>
          <marker id="zB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#36e"/></marker>
          <marker id="zG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2a2"/></marker>
        </defs>
        <line x1="30" y1="340" x2="570" y2="340" stroke="#bbb" stroke-width="2"/>
        <g opacity=".2" stroke="#aaa"><line x1="30" y1="342" x2="44" y2="358"/><line x1="56" y1="342" x2="70" y2="358"/><line x1="82" y1="342" x2="96" y2="358"/><line x1="108" y1="342" x2="122" y2="358"/></g>
        <polygon points="90,340 430,340 430,160" fill="rgba(0,0,0,.04)"/>
        <line x1="90" y1="340" x2="430" y2="160" stroke="#888" stroke-width="3"/>
        <line x1="430" y1="160" x2="430" y2="340" stroke="#999" stroke-width="2"/>
        <path d="M 155,340 A 65,65 0 0,0 132,308" fill="none" stroke="#999" stroke-width="1.5"/>
        <text x="162" y="328" font-size="15" fill="#666" font-weight="600">30°</text>
        <g transform="translate(300,228) rotate(-28)">
          <rect x="-34" y="-54" width="68" height="54" fill="#555" stroke="#444" stroke-width="2" rx="6" filter="drop-shadow(0 3px 8px rgba(0,0,0,.12))"/>
          <text x="0" y="-20" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">2 kg</text>
        </g>
        <line x1="300" y1="228" x2="300" y2="340" stroke="#d44" stroke-width="3" marker-end="url(#zR)"/>
        <line x1="300" y1="228" x2="258" y2="142" stroke="#36e" stroke-width="3" marker-end="url(#zB)"/>
        <line x1="300" y1="228" x2="360" y2="197" stroke="#2a2" stroke-width="3" marker-end="url(#zG)"/>
        <text x="310" y="290" font-size="13" font-weight="600" fill="#d44">mg = 19.6 N</text>
        <text x="214" y="138" font-size="13" font-weight="600" fill="#36e">N = 17.0 N</text>
        <text x="366" y="194" font-size="13" font-weight="600" fill="#2a2">f = 5.1 N</text>
      </svg>
      <!-- Celestial -->
      <svg class="scene-svg" id="sv-c" width="600" height="420" viewBox="0 0 600 420">
        <defs>
          <radialGradient id="zsG"><stop offset="0%" stop-color="#fef9c3"/><stop offset="40%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></radialGradient>
          <radialGradient id="zeG" cx="35%" cy="35%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="60%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e3a8a"/></radialGradient>
          <filter id="zsGl"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <marker id="zFa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f66"/></marker>
          <marker id="zVa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4c8"/></marker>
        </defs>
        <ellipse cx="300" cy="210" rx="200" ry="155" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1" stroke-dasharray="5 3"/>
        <circle cx="300" cy="210" r="32" fill="url(#zsG)" filter="url(#zsGl)"/>
        <text x="300" y="258" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.3)">太阳</text>
        <circle cx="500" cy="210" r="14" fill="url(#zeG)" stroke="rgba(147,197,253,.3)" stroke-width="1"/>
        <text x="500" y="236" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.35)">地球</text>
        <line x1="484" y1="210" x2="344" y2="210" stroke="#f66" stroke-width="2" marker-end="url(#zFa)" opacity=".8"/>
        <line x1="500" y1="194" x2="500" y2="118" stroke="#4c8" stroke-width="2" marker-end="url(#zVa)" opacity=".8"/>
        <text x="400" y="200" font-size="11" fill="#f66" font-weight="600" text-anchor="middle">F引力</text>
        <text x="520" y="155" font-size="11" fill="#4c8" font-weight="600">v轨道</text>
      </svg>
      <!-- Circuit -->
      <svg class="scene-svg" id="sv-e" width="560" height="400" viewBox="0 0 560 400">
        <defs><marker id="zIA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b80"/></marker></defs>
        <rect x="120" y="70" width="320" height="240" rx="12" fill="none" stroke="#999" stroke-width="2.5"/>
        <line x1="120" y1="162" x2="120" y2="152" stroke="#999" stroke-width="3.5"/>
        <line x1="112" y1="152" x2="128" y2="152" stroke="#999" stroke-width="2.5"/>
        <line x1="115" y1="145" x2="125" y2="145" stroke="#999" stroke-width="1.5"/>
        <line x1="120" y1="212" x2="120" y2="202" stroke="#999" stroke-width="3.5"/>
        <line x1="112" y1="212" x2="128" y2="212" stroke="#999" stroke-width="2.5"/>
        <text x="88" y="187" font-size="13" font-weight="700" fill="#555" text-anchor="middle">12V</text>
        <rect x="250" y="60" width="60" height="22" fill="#fff8e0" stroke="#b80" stroke-width="1.5" rx="4"/>
        <text x="280" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#864">R₁ 4&Omega;</text>
        <rect x="250" y="298" width="60" height="22" fill="#e8f0fe" stroke="#36e" stroke-width="1.5" rx="4"/>
        <text x="280" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#24a">R₂ 8&Omega;</text>
        <g opacity=".6"><line x1="190" y1="70" x2="235" y2="70" stroke="#b80" stroke-width="2" marker-end="url(#zIA)"/><line x1="440" y1="120" x2="440" y2="160" stroke="#b80" stroke-width="2" marker-end="url(#zIA)"/><line x1="350" y1="310" x2="320" y2="310" stroke="#b80" stroke-width="2" marker-end="url(#zIA)"/></g>
        <text x="456" y="180" font-size="12" font-weight="700" fill="#555">I = 1.0 A</text>
      </svg>
    </div>
    <button class="float-play" id="floatPlay">&#9654;</button>
  </div>

  <!-- BOTTOM DOCK -->
  <div class="dock" id="dock">
    <div class="dock-row">
      <!-- Mechanics -->
      <div class="pg active" id="pg-m">
        <div class="pill"><span class="pill-label">质量</span><input type="range" class="pill-slider" value="20"><span class="pill-val">2.0 kg</span></div>
        <div class="pill"><span class="pill-label">角度</span><input type="range" class="pill-slider" value="33"><span class="pill-val">30°</span></div>
        <div class="pill"><span class="pill-label">&mu;</span><input type="range" class="pill-slider" value="30"><span class="pill-val">0.30</span></div>
        <div class="readout-pill"><span class="rp-dot" style="background:#d44"></span><span class="rp-val">19.6</span><span class="rp-unit">N mg</span></div>
        <div class="readout-pill"><span class="rp-dot" style="background:#36e"></span><span class="rp-val">17.0</span><span class="rp-unit">N</span></div>
        <div class="readout-pill"><span class="rp-dot" style="background:#2a2"></span><span class="rp-val">5.1</span><span class="rp-unit">N f</span></div>
        <div class="readout-pill"><span class="rp-val">a=2.35</span><span class="rp-unit">m/s²</span></div>
      </div>
      <!-- Celestial -->
      <div class="pg" id="pg-c">
        <div class="pill"><span class="pill-label">M☉</span><input type="range" class="pill-slider" value="50"><span class="pill-val">1.0</span></div>
        <div class="pill"><span class="pill-label">半径</span><input type="range" class="pill-slider" value="50"><span class="pill-val">1.0 AU</span></div>
        <div class="pill"><span class="pill-label">速度</span><input type="range" class="pill-slider" value="60"><span class="pill-val">29.8 km/s</span></div>
        <div class="readout-pill"><span class="rp-val">T=365</span><span class="rp-unit">天</span></div>
        <div class="readout-pill"><span class="rp-val">e=0.017</span></div>
      </div>
      <!-- Circuit -->
      <div class="pg" id="pg-e">
        <div class="pill"><span class="pill-label">U</span><input type="range" class="pill-slider" value="48"><span class="pill-val">12 V</span></div>
        <div class="pill"><span class="pill-label">R₁</span><input type="range" class="pill-slider" value="16"><span class="pill-val">4 &Omega;</span></div>
        <div class="pill"><span class="pill-label">R₂</span><input type="range" class="pill-slider" value="32"><span class="pill-val">8 &Omega;</span></div>
        <div class="readout-pill"><span class="rp-val">I=1.0</span><span class="rp-unit">A</span></div>
        <div class="readout-pill"><span class="rp-val">P=12</span><span class="rp-unit">W</span></div>
      </div>
    </div>
    <div class="dock-toggle" onclick="document.getElementById('dockExtra').classList.toggle('open');this.querySelector('span').textContent=document.getElementById('dockExtra').classList.contains('open')?'收起 ▾':'更多 ▴'"><span>更多 &#9652;</span></div>
    <div class="dock-extra" id="dockExtra">
      <div class="dock-extra-inner">
        <div class="pill"><span class="pill-label">g</span><input type="range" class="pill-slider" value="98"><span class="pill-val">9.8 m/s²</span></div>
        <div class="pill"><span class="pill-label">弹性</span><input type="range" class="pill-slider" value="80"><span class="pill-val">0.80</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const names={m:['斜面受力','力学'],c:['行星轨道','天体'],e:['串联电路','电路']};
function sw(id){
  document.getElementById('tName').textContent=names[id][0];
  document.getElementById('tScene').textContent=names[id][1];
  ['m','c','e'].forEach(s=>{
    document.getElementById('sv-'+s).classList.toggle('active',s===id);
    document.getElementById('pg-'+s).classList.toggle('active',s===id);
  });
  document.querySelectorAll('.t-tab').forEach(t=>{
    t.classList.toggle('active',t.textContent==={m:'力学',c:'天体',e:'电路'}[id]);
  });
  const bg=document.getElementById('cBg');
  bg.className='c-bg bg-'+id;
}
</script>
</body>
</html>
